spring.application.name=Gateway

server.port=8088

#Microservice catalog_medicament
#Configuration Statique
#spring.cloud.gateway.server.webflux.routes[0].id=CATALOG
#spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8083
#spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/medicaments/**,/api/principes-actifs/**

#Configuration Dynamique
spring.cloud.gateway.server.webflux.routes[0].id=CATALOG
spring.cloud.gateway.server.webflux.routes[0].uri=lb://catalog-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/medicaments/**,/api/principes-actifs/**

spring.cloud.gateway.server.webflux.routes[1].id=CATALOG-DOCS
spring.cloud.gateway.server.webflux.routes[1].uri=lb://catalog-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/catalog/v3/api-docs
spring.cloud.gateway.server.webflux.routes[1].filters[0]=RewritePath=/catalog/(?<segment>.*), /$\{segment}

logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG

springdoc.swagger-ui.urls[0].name=Catalogue
springdoc.swagger-ui.urls[0].url=/catalog/v3/api-docs
