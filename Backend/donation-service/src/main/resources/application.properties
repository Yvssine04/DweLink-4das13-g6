
spring.application.name=donation-service
server.port=8085

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/don_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Desactivation temporaire de Config Server
spring.cloud.config.enabled=false

# Desactivation temporaire de Eureka
eureka.client.enabled=false
spring.cloud.discovery.enabled=false

# Desactivation temporaire des listeners RabbitMQ
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false
spring.rabbitmq.dynamic=false
management.health.rabbit.enabled=false
