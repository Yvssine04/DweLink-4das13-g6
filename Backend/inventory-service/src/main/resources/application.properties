spring.application.name=inventory-service
server.port=8084

# MongoDB : la base stock_db sera créée toute seule à la première écriture
spring.mongodb.uri=mongodb://localhost:27017/stock_db
spring.data.mongodb.auto-index-creation=true

management.endpoints.web.exposure.include=health

# Eureka n'est pas encore lancé : on le désactive pour l'instant
eureka.client.enabled=false